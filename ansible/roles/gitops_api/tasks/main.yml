---
- name: Install Java 21 runtime
  ansible.builtin.apt:
    name: openjdk-21-jre-headless
    state: present
    update_cache: true

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ app_jar_src }}"
    dest: "{{ app_dir }}/{{ app_jar_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
    backup: true
  register: jar_copy_result
  notify: Restart gitops API

- name: Deploy systemd unit file
  ansible.builtin.template:
    src: gitops-api.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: unit_result
  notify: Restart gitops API

- name: Reload systemd when unit file changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: unit_result.changed

- name: Enable and start gitops-api service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true